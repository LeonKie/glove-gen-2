[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "glovegen"
version = "2.0.0"
description = "Turn a high-detail positive scan into a printable, castable 2-part rigid mold"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "trimesh>=4.0",
    "manifold3d>=2.3",
    "networkx>=3.0",
    "rtree>=1.0",
    "fast-simplification>=0.1.7",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
fast = ["embreex>=2.17"]
dev = ["pytest>=7.4"]

[project.scripts]
glovegen = "glovegen.cli:main"

[tool.setuptools.packages.find]
include = ["glovegen*", "server*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
markers = ["slow: exercises a real worker process end to end"]
